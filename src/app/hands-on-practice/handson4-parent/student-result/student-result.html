<h2>Student Records</h2>
<table >
    <tr>
        <th>Name</th>

        <th>Marks</th>

        <th> Result </th>
    </tr>
    <tbody>
        @for(items of studentRecords ; track items){
          <tr>
             <td>{{ items.studentName }}</td>
             
                <td> {{ items.marks }}</td>
             
              @if(items.marks>35 || items.marks ==35){
                <td style="color:green">Pass </td>
              }@else{
                <td style="color:red">Fail</td>
              }
              </tr>
        }        
    </tbody>
</table>
