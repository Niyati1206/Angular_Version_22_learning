<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Email</th>
        <th> Is Alcoholic ?</th>
        <th>Contact</th>
        <th>Role</th>

    </tr>
    @for(item of users; track item){
        <tr>
            <td>{{item.name}}</td>
            <td>{{item.age}}</td>
            <td>{{item.email}}</td>
            <td>{{item.isAlcoholic}}</td>
            <td>{{item.contact}}</td>
            <td>{{item.role}}</td>
        </tr>
    }
</table>
