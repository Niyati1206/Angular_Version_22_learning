<table>
    <tr>
        <th>Product Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total Price</th>
    </tr>
    @for(prod of productList; track prod.Prodname){
        <tr>
            <td>{{prod.Prodname}}</td>
            <td>{{prod.category.type}}</td>
            <td>{{prod.price}}</td>
            <td>{{prod.quantity}}</td>
            <td>{{ prod.quantity * prod.price}}</td>
        </tr>
    }
</table>
<p>Total Quantity = {{total()}} </p>
